- name: workflow_scheduler
  webhook: '{{NHOST_FUNCTIONS_URL}}/schedule-workflows'
  schedule: '* * * * *'
  include_in_metadata: true
  payload: {}
  retry_conf:
    num_retries: 3
    retry_interval_seconds: 10
    timeout_seconds: 60
    tolerance_seconds: 21600
  headers:
    - name: x-action-secret
      value_from_env: ACTION_SECRET
